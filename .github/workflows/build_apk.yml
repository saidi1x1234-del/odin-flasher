name: Build and Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython requests colorama

      - name: Build APK with Buildozer
        run: |
          echo "[app]" > buildozer.spec
          echo "title = Odin Pro Broker" >> buildozer.spec
          echo "package.name = odinbroker" >> buildozer.spec
          echo "package.domain = com.mohammad.odin" >> buildozer.spec
          echo "source.include_exts = py,png,jpg,kv,atlas" >> buildozer.spec
          echo "version = 1.0" >> buildozer.spec
          echo "requirements = python3,kivy,requests,colorama" >> buildozer.spec
          echo "orientation = portrait" >> buildozer.spec
          
          buildozer -v android debug

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: bin/*.apk
          tag_name: v1.0-${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
